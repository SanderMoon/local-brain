site_name: Local Brain
site_description: Plain markdown files. Full project management. Managed by AI, or by you.
site_url: https://sandermoon.github.io/local-brain/
repo_url: https://github.com/SanderMoon/local-brain
repo_name: SanderMoon/local-brain

exclude_docs: |
  README.md

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  custom_dir: docs/overrides

nav:
  - Quickstart: index.md
  - Installation: installation.md
  - TUI Dashboard: tui.md
  - Command Reference: commands.md
  - File Format: file-format.md
  - Workflows: workflows.md
  - MCP Server: mcp-server.md
  - Agent Skills: skills.md
  - Development: development.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search

extra_css:
  - stylesheets/terminal-sage.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SanderMoon/local-brain
